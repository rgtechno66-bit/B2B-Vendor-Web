  <!-- Default SEO (overridden per-route by PageSeo / react-helmet-async) -->

    content="Intecomart is a B2B industrial marketplace for wholesale buyers and suppliers. Browse industrial products, request quotes, and streamline your procurement." />

  <meta property="og:title" content="Intecomart | B2B Industrial Marketplace" />

  <!-- Favicon: relative paths work on local + live. Google follows homepage and resolves them. -->

  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />

  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="theme-color" content="#EF7F1A" />
  <link rel="canonical" href="https://www.intecomart.com" />

  <!-- Organization + WebSite schema (absolute URLs required for Google) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Intecomart",
      "url": "https://www.intecomart.com",
      "logo": "https://www.intecomart.com/favicon/android-chrome-192x192.png",
      "description": "Intecomart is a B2B industrial marketplace for wholesale buyers and suppliers.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9811068569",
        "contactType": "customer service",
        "areaServed": "IN"
      }
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Intecomart",
      "url": "https://www.intecomart.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.intecomart.com/product?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
